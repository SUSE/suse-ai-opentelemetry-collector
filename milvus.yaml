# Optional profile: load after /otelcol/collector-config.yaml.
# Unset/empty MILVUS_METRICS_ENDPOINT selects pod discovery; a nonempty value
# selects only the static fallback. Discovery still requires Kubernetes API RBAC.
receivers:
  prometheus/milvus:
    config:
      scrape_configs:
      - job_name: milvus
        scrape_interval: 15s
        metrics_path: /metrics
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: ["${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}"]
        relabel_configs:
        # An endpoint override disables discovery targets, including local overrides.
        - target_label: __tmp_static_endpoint
          replacement: "${env:MILVUS_METRICS_ENDPOINT:-}"
        - source_labels: [__tmp_static_endpoint]
          action: drop
          regex: ".+"
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: "${env:MILVUS_K8S_SERVICE_NAME:-milvus}"
        - source_labels: [__address__]
          action: keep
          regex: ".*:${env:MILVUS_METRICS_PORT:-9091}"
        # Keep only real, ready pod-backed endpoints (not extra container ports).
        - source_labels: [__meta_kubernetes_endpoint_address_target_kind]
          action: keep
          regex: Pod
        - source_labels: [__meta_kubernetes_endpoint_ready]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_uid]
          action: keep
          regex: ".+"
        - target_label: service_name
          replacement: "${env:MILVUS_SERVICE_NAME:-milvus}"
        - source_labels: [__meta_kubernetes_namespace]
          target_label: service_namespace
        - target_label: db_system
          replacement: milvus
        - target_label: suse_ai_product
          replacement: milvus
        - source_labels: [__meta_kubernetes_pod_uid]
          target_label: k8s_pod_uid
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: k8s_pod_name
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: k8s_node_name
        - source_labels: [__meta_kubernetes_namespace]
          target_label: k8s_namespace_name
      - job_name: milvus-static
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
        - targets: ["${env:MILVUS_METRICS_ENDPOINT:-${env:MILVUS_K8S_SERVICE_NAME:-milvus}.${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}.svc.${env:K8S_CLUSTER_DOMAIN:-cluster.local}:${env:MILVUS_METRICS_PORT:-9091}}"]
          labels:
            service_name: "${env:MILVUS_SERVICE_NAME:-milvus}"
            service_namespace: "${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}"
            db_system: milvus
            suse_ai_product: milvus
        relabel_configs:
        # The default address is a valid placeholder; it is never scraped.
        - target_label: __tmp_static_endpoint
          replacement: "${env:MILVUS_METRICS_ENDPOINT:-}"
        - source_labels: [__tmp_static_endpoint]
          action: keep
          regex: ".+"

processors:
  transform/milvus_scope:
    error_mode: propagate
    metric_statements:
    - context: resource
      conditions:
      - >-
        "${env:K8S_CLUSTER_NAME:-}" != "" and ("${env:MILVUS_TARGET_IN_CLUSTER:-false}" == "true" or "${env:MILVUS_METRICS_ENDPOINT:-}" == "${env:MILVUS_K8S_SERVICE_NAME:-milvus}.${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}.svc.${env:K8S_CLUSTER_DOMAIN:-cluster.local}:${env:MILVUS_METRICS_PORT:-9091}")
      statements:
      - set(resource.attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME:-}") where resource.attributes["k8s.cluster.name"] == nil or resource.attributes["k8s.cluster.name"] == ""
      - set(resource.attributes["k8s.namespace.name"], "${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}") where resource.attributes["k8s.namespace.name"] == nil or resource.attributes["k8s.namespace.name"] == ""

  # Opt-in ownership assertion; match only this Service's full DNS name and port.
  transform/milvus_peer:
    error_mode: ignore
    trace_statements:
    - context: span
      conditions:
      - >-
        "${env:MILVUS_ASSOCIATE_CLIENT_SPANS:-false}" == "true" and
        "${env:K8S_CLUSTER_NAME:-}" != "" and
        span.kind == SPAN_KIND_CLIENT and
        resource.attributes["k8s.cluster.name"] == "${env:K8S_CLUSTER_NAME:-}" and
        span.attributes["db.system.name"] == "milvus" and
        span.attributes["server.address"] == "${env:MILVUS_K8S_SERVICE_NAME:-milvus}.${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}.svc.${env:K8S_CLUSTER_DOMAIN:-cluster.local}" and
        String(span.attributes["server.port"]) == "${env:MILVUS_CLIENT_PORT:-19530}" and
        ("${env:MILVUS_METRICS_ENDPOINT:-}" == "" or "${env:MILVUS_TARGET_IN_CLUSTER:-false}" == "true" or "${env:MILVUS_METRICS_ENDPOINT:-}" == "${env:MILVUS_K8S_SERVICE_NAME:-milvus}.${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}.svc.${env:K8S_CLUSTER_DOMAIN:-cluster.local}:${env:MILVUS_METRICS_PORT:-9091}") and
        (span.attributes["suse.ai.peer.service.name"] == nil or span.attributes["suse.ai.peer.service.name"] == "") and
        (span.attributes["suse.ai.peer.service.namespace"] == nil or span.attributes["suse.ai.peer.service.namespace"] == "") and
        (span.attributes["suse.ai.peer.cluster"] == nil or span.attributes["suse.ai.peer.cluster"] == "")
      statements:
      - set(span.attributes["suse.ai.peer.service.name"], "${env:MILVUS_SERVICE_NAME:-milvus}")
      - set(span.attributes["suse.ai.peer.service.namespace"], "${env:MILVUS_NAMESPACE:-${env:SUSE_AI_NAMESPACE:-suse-private-ai}}")
      - set(span.attributes["suse.ai.peer.cluster"], "${env:K8S_CLUSTER_NAME:-}")

service:
  pipelines:
    metrics/milvus:
      receivers:
      - prometheus/milvus
      processors:
      - memory_limiter
      - transform/prometheus
      - transform/kubernetes_identity
      - transform/milvus_scope
      - resource
      - transform/suse_ai_resource
      - transform/genai-normalize
      - batch
      exporters:
      - otlp
